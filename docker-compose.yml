services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rag-sql-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      # Read-only role created by db/init/02-roles.sh for the agent
      APP_DB_USER: ${APP_DB_USER:-rag_reader}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      # Chat history role created by db/init/04-chat-memory.sh
      CHAT_DB_USER: ${CHAT_DB_USER:-rag_memory}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?set CHAT_DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # CSV files loaded by the init scripts (e.g. 03-employees.sql)
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Streamlit chat UI (src/rag_sql/web.py). Rebuild after code changes: docker compose up -d --build
  web:
    build: .
    image: rag-sql-web
    container_name: rag-sql-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside the compose network, Postgres is the "postgres" service on its container port.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # The UI only uses the read-only and chat roles, so it never gets admin credentials.
      POSTGRES_USER: ""
      POSTGRES_PASSWORD: ""
    ports:
      # This device only.
      - "127.0.0.1:${WEB_PORT:-8501}:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
