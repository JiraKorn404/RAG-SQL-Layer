[project]
name = "rag-sql-layer"
version = "0.1.0"
description = "RAG text-to-SQL agent over self-hosted PostgreSQL, using Ollama and LangGraph"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # LLM + orchestration
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "langgraph>=1.0",
    # Vector store (pgvector)
    "langchain-postgres>=0.0.15",
    # Database
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "sqlglot>=26.0",
    # Config
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # Result tables (notebook and web UI)
    "pandas>=2.2",
    # Ollama client, for listing models (llm.py)
    "ollama>=0.6",
]

[project.scripts]
rag-sql-index = "rag_sql.retrieval:main"
rag-sql-history = "rag_sql.query_history:main"

[project.optional-dependencies]
# Streamlit chat UI (web.py); the only extra installed in the Docker image.
web = [
    "streamlit>=1.64.0",
]
# Notebook rendering (display.py). The dev group has JupyterLab, which includes it.
notebook = [
    "ipython>=9.17.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbstripout>=0.9.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs a running Postgres and/or Ollama (run with: pytest -m integration)",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
