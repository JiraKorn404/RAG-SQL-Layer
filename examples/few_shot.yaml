# Question -> SQL pairs, embedded into the vector index and retrieved by similarity to the
# user's question. Keep the SQL valid PostgreSQL for the current schema (retail).
# Re-run `uv run rag-sql-index` after editing.
#
# These show patterns, not answers to the evaluation cases: evaluation/cases.yaml must not repeat
# these questions (checked by tests). Products and categories have no real names, so the examples
# refer to them by id.

- question: How many orders were placed in each year?
  sql: |
    SELECT extract(year FROM order_date)::int AS year, count(*) AS orders
    FROM retail.orders
    GROUP BY 1
    ORDER BY 1;

- question: What is the total revenue in each store city?
  sql: |
    SELECT s.city, sum(p.amount) AS revenue
    FROM retail.payments AS p
    JOIN retail.orders AS o USING (order_id)
    JOIN retail.stores AS s USING (store_id)
    GROUP BY s.city
    ORDER BY revenue DESC;

- question: How many units of each category were sold?
  sql: |
    SELECT c.category_name, sum(i.qty) AS units
    FROM retail.order_items AS i
    JOIN retail.products AS p USING (product_id)
    JOIN retail.categories AS c USING (category_id)
    GROUP BY c.category_name
    ORDER BY units DESC;

- question: What share of shipments has each status?
  sql: |
    SELECT status, round(100.0 * count(*) / sum(count(*)) OVER (), 2) AS percent
    FROM retail.shipments
    GROUP BY status
    ORDER BY percent DESC;

- question: What are the 5 most expensive products by list price?
  sql: |
    SELECT product_id, price
    FROM retail.products
    ORDER BY price DESC, product_id
    LIMIT 5;

- question: What is the average salary of the employees at each store?
  sql: |
    SELECT store_id, round(avg(salary), 2) AS avg_salary
    FROM retail.employees
    GROUP BY store_id
    ORDER BY store_id;

- question: How many customers signed up in each year?
  sql: |
    SELECT extract(year FROM signup_date)::int AS year, count(*) AS customers
    FROM retail.customers
    GROUP BY 1
    ORDER BY 1;

- question: How many products does each supplier country provide?
  sql: |
    SELECT s.country, count(*) AS products
    FROM retail.products AS p
    JOIN retail.suppliers AS s USING (supplier_id)
    GROUP BY s.country
    ORDER BY products DESC;
